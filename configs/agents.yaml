# Agent system (SPEC §10.1). Used from phase 02.
# Graph: intake -> supervisor -> (fan-out via Send) attribution | data_quality | policy
#        -> writer -> critic -> [fail: back to the named specialist] -> human_approval
#        (interrupt) -> dispatch | close

llm:
  provider: bedrock # langchain_aws.ChatBedrockConverse
  model_id: openai.gpt-oss-120b-1:0 # BEDROCK_MODEL_ID in the environment overrides it
  region: ap-south-1 # AWS_REGION in the environment overrides it
  temperature: 0
  max_output_tokens: 4096 # per call, reasoning included

# On-demand USD per 1M tokens, ap-south-1, from the AWS Price List API on 2026-09-19.
# Used for cost estimates and the eval's cost per incident.
prices_per_mtok:
  openai.gpt-oss-120b-1:0: {input: 0.18, output: 0.71}

budget_per_incident: # exceeding either stops the run with status needs_human
  max_tokens: 60000
  max_tool_calls: 25

critic:
  max_loops: 2 # critic-to-specialist retries before moving on

nodes: # node -> agent pattern
  supervisor: plan_and_execute
  attribution: react # tree_of_thought from phase 05c
  data_quality: react
  policy: agentic_rag
  writer: structured_generation
  critic: reflection

# Per-agent tool allowlists (SPEC §10.2). The baseline gets every tool below.
# send_escalation_email is called only by the dispatch node, never by an LLM.
tools:
  attribution:
    - get_limit_status
    - get_risk_results
    - run_var_explain
    - get_top_contributors
    - list_new_trades
    - get_trade
    - get_greeks
    - run_stress
  data_quality:
    - get_dq_findings
    - compare_sources
    - get_top_contributors
    - get_limit_status
  policy:
    - search_policy

eval:
  # Frozen test split (SPEC §11.1): SHA-256 of the test IDs and their ground truth, as written
  # to data/synthetic/incidents/split.json. Verified before every run.
  test_split_sha256: 3ddf23869e2b85be3e1407976cef432f1fe7353a6d187fee63f4a1e057ee8b6f
