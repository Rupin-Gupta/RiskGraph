# Pricing and risk parameters (SPEC §4.1-§4.3, §4.5, §4.7). Used from phase 01a.

# Volatility for Monte Carlo VaR and single-stock option pricing: "ewma" or a vol model
# name once phase 05b selects one.
vol_source: ewma
ewma_lambda: 0.94 # EWMA decay for vols and the covariance matrix

pricing:
  option_vol:
    SPY: vix # implied vol = VIXCLS / 100
    single_stock: vol_source # AAPL, MSFT, JPM use the forecast vol from vol_source
  curve:
    points: [DGS2, DGS5, DGS10] # Treasury CMT yields, single-curve USD valuation
    interpolation: linear
    extrapolation: flat
  dv01_bump_bp: 1 # parallel bump for IRS and bond DV01

# Covered interest parity needs a rate for the non-USD leg of each FX forward. There is no
# EUR or INR curve in the data, so a constant proxy is used (ADR-005). Decimal, semi-annual.
fx_forward:
  foreign_rate_proxy:
    EUR: 0.02
    INR: 0.065

# How each factor's historical shocks are measured (SPEC §4.2). Shocks are applied to
# today's market state and every trade is fully revalued per scenario.
risk_factors:
  equity: log_return
  fx: log_return
  rates: absolute_change_bp
  vix: log_change

var:
  horizon_days: 1
  confidence: 0.99
  es_confidence: 0.975 # ES over the same scenarios as historical VaR
  window_days: 500 # historical simulation lookback
  levels: [desk, firm]

parametric: # delta-normal, comparison only
  covariance: ewma # uses ewma_lambda

monte_carlo:
  n_scenarios: 10000
  correlation: cholesky # Cholesky of the covariance matrix
  revaluation: full

backtest:
  window_days: 250
  pnl: hypothetical # static positions, next-day market move vs the prior day's 99% VaR
  tests: [kupiec_pof, christoffersen_independence]
  traffic_light: # Basel zones by exception count
    green: [0, 4]
    yellow: [5, 9]
    red_from: 10

explain:
  # Euler-style allocation: average position P&L over this many tail scenarios on each
  # side of the VaR quantile.
  tail_neighbors: 5

# Market data controls (SPEC §5, phase 01b). Thresholds come from 2015-2021 data only; the
# 2022-2025 evaluation window was not used to set them.
controls:
  yields: [DGS2, DGS5, DGS10] # percent; every other series is a price and must be positive
  yield_range_pct: [-1.0, 20.0]
  # Largest believable |1-day move| per series: log return, or bp for yields. About twice
  # the largest 2015-2021 move of that asset class.
  max_move:
    SPY: 0.35
    AAPL: 0.35
    MSFT: 0.35
    JPM: 0.35
    EURUSD=X: 0.06
    INR=X: 0.06
    DEXUSEU: 0.06
    DEXINUS: 0.06
    DGS2: 60
    DGS5: 60
    DGS10: 60
    VIXCLS: 1.6
  # A null is a missed print (not a holiday) when most of the series' peers print that day.
  calendars:
    equity: [SPY, AAPL, MSFT, JPM, VIXCLS]
    fx: [EURUSD=X, INR=X]
    treasury: [DGS2, DGS5, DGS10]
    fred_fx: [DEXUSEU, DEXINUS]
  staleness:
    min_days: 3 # this many consecutive identical prints
    # Liquid series only: Treasury yields are quoted to 1bp and often sit unchanged for days.
    series: [SPY, AAPL, MSFT, JPM, EURUSD=X, INR=X, VIXCLS]
  cross_source:
    # yfinance factor -> FRED series in the same quote convention: DEXUSEU is USD per EUR
    # like EURUSD=X; DEXINUS is INR per USD like INR=X. The yfinance close dated D tracks
    # FRED's noon New York print of D-1, so D is compared with FRED's previous print.
    pairs:
      EURUSD=X: DEXUSEU
      INR=X: DEXINUS
    tolerance_bp: 200 # just above the largest 2015-2021 gap
  isolation_forest:
    train_end: "2021-12-31" # fit on 2015-2021 only
    vol_window: 60 # trailing prints for the z-score volatility
    short_window: 5 # short vol for the vol ratio
    n_estimators: 200
    cutoff_quantile: 0.999 # flag scores above this quantile of the training scores
  severity: # critical findings hold the factor flat in that day's revaluation
    pandera: critical
    staleness: critical
    cross_source: critical
    isolation_forest: warning
