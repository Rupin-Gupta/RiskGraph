# Public entry point on the EC2 host (SPEC §13.2, ADR-014): HTTPS with a Let's Encrypt
# certificate for the Elastic IP, and basic auth for the whole site.
server {
    listen 80;
    server_tokens off;

    location /.well-known/acme-challenge/ { # certificate issuance and renewal (cert.sh)
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    auth_basic "RiskGraph demo";
    auth_basic_user_file /etc/nginx/htpasswd;

    # The weekday trigger Lambda authenticates with the API's bearer token instead.
    location = /api/runs/daily {
        auth_basic off;
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
