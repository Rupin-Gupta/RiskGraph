# Public entry point on the EC2 host: basic auth for the whole site (SPEC §13.2).
server {
    listen 80;
    client_max_body_size 1m;
    server_tokens off;

    auth_basic "RiskGraph demo";
    auth_basic_user_file /etc/nginx/htpasswd;

    # The EventBridge-triggered Lambda authenticates with the API's bearer token instead.
    location = /api/runs/daily {
        auth_basic off;
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
