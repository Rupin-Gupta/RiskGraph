name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: make lint
      - run: make test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # On main: build both images, push them to ECR with an OIDC-assumed role (no static keys), and
  # deploy with SSM Run Command (SPEC §13.2). Skipped until the repository variables are set.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Images can be built before the instance exists; the SSM deploy waits for it.
      - name: Check the deploy variables
        id: cfg
        run: |
          echo "ready=${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}" >> "$GITHUB_OUTPUT"
          echo "deployable=${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.cfg.outputs.ready == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
        if: steps.cfg.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: docker/build-push-action@v7
        if: steps.cfg.outputs.ready == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/riskgraph-api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/riskgraph-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v7
        if: steps.cfg.outputs.ready == 'true'
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/riskgraph-frontend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/riskgraph-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy through SSM Run Command
        if: steps.cfg.outputs.deployable == 'true'
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters commands="/opt/riskgraph/infra/aws/deploy.sh $GITHUB_SHA" \
            --query Command.CommandId --output text)
          for _ in $(seq 80); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 15
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "status: $status"
          [ "$status" = Success ]
